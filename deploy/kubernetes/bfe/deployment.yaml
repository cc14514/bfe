apiVersion: apps/v1
kind: Deployment
metadata:
  name: bfe
  namespace: bfe
  labels:
    app.kubernetes.io/name: bfe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bfe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bfe
    spec:
      containers:
        - name: bfe
          # 替换为你们的镜像仓库地址与 tag，例如：example.com/bfe:dev-<gitsha>
          image: bfe:dev-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
            - name: monitor
              containerPort: 8421
          env:
            # 是否启用 conf-agent（默认 false）
            - name: CONF_AGENT_ENABLED
              value: "false"
            # 控制面 URL（启用 conf-agent 时需提供）
            # - name: CONTROL_PLANE_URL
            #   value: "https://example.com/config-api"
          readinessProbe:
            httpGet:
              path: /monitor
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: base-conf
              mountPath: /etc/bfe/base-conf
              readOnly: true
            # 可写配置目录（入口会从 base-conf/conf-default 拷贝并由 conf-agent 更新）
            - name: conf
              mountPath: /bfe/conf
            # 日志目录（可写）
            - name: log
              mountPath: /bfe/log
          # 初期不强制 liveness，避免误杀；如需可按环境增加
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: base-conf
          configMap:
            name: bfe-base-conf
        # 可写配置目录（emptyDir，容器内拷贝/conf-agent 写入）
        - name: conf
          emptyDir: {}
        # 日志目录
        - name: log
          emptyDir: {}
